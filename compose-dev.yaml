# Desarrollo local en tu Mac: base de datos + backend.
# La app la corres aparte con Expo (cd frontend && npm run web).
#   docker compose -f compose-dev.yaml up -d --build
name: budodesk-local

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false   # opcional en local
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-budodesk_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-secret-local-dev-secret-0001}
      # Correo: usa el SMTP del .env (SMTP_HOST, SMTP_USER, SMTP_PASS…). Con SMTP_HOST vacío,
      # los correos solo se imprimen en el log: docker compose -f compose-dev.yaml logs -f backend
      SMTP_HOST: ${SMTP_HOST:-}
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      APP_BASE_URL: http://localhost:8081
      TRUST_PROXY: 0
      UPLOAD_DIR: /usr/src/app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local}
      MYSQL_DATABASE: budodesk
      MYSQL_USER: ${DB_USER:-budodesk_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-password}
      TZ: UTC
    ports:
      - "3306:3306"   # para MySQL Workbench / TablePlus
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata: {}
  uploads: {}
